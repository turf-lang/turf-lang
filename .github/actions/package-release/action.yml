name: "Package Turf release"
description: "Build the release archive (scripts/package_release.sh) in the REL-003 layout"
inputs:
  platform-suffix:
    description: "e.g. linux-x86_64, linux-arch-x86_64, macos-arm64, windows-x86_64"
    required: true
  archive-format:
    description: "tar.gz or zip"
    required: true
  bin-extra:
    description: "Newline-separated files to put in bin/ next to turf and turfc (the DLLs turfc.exe needs)"
    required: false
    default: ""
outputs:
  archive-path:
    description: "Path to the produced archive"
    value: ${{ steps.pack.outputs.archive-path }}
runs:
  using: "composite"
  steps:
    - id: pack
      shell: bash
      run: |
        set -e
        # The layout, the version check (the pushed tag must be v<VERSION>) and
        # the checksum all live in the script, so what is published is what a
        # developer can build and open with the same command.
        EXTRA=()
        while IFS= read -r f; do
          [ -n "$f" ] && EXTRA+=(--bin-extra "$f")
        done <<< "${{ inputs.bin-extra }}"
        ARCHIVE=$(./scripts/package_release.sh \
          --platform "${{ inputs.platform-suffix }}" \
          --format "${{ inputs.archive-format }}" \
          --expect-tag "${GITHUB_REF_NAME}" \
          ${EXTRA[@]+"${EXTRA[@]}"})
        echo "archive-path=${ARCHIVE}" >> "$GITHUB_OUTPUT"
