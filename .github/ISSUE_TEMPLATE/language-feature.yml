name: "Language feature"
description: "Propose an addition or improvement to Language"
title: "[LANGUAGE] "
type: Feature
labels: [language-feature, enhancement]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What do you want, and why? One or two sentences.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? Show example code or output if it helps.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know it is done?
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the open and closed issues and found no duplicate.
          required: true
