name: "Compiler bug"
description: "Something in Compiler does not work as documented"
title: "[BUG] "
type: Bug
labels: []
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, and what went wrong? Paste the exact output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest steps or program that shows the problem.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Where did it fail
      options:
        - Lexer / parser
        - Resolver
        - Type checker
        - Codegen (compiled program is wrong)
        - Runtime / GC
        - Linking
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `turf --version` (or `turfc --version`).
      placeholder: 2.1.1
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the open and closed issues and found no duplicate.
          required: true
