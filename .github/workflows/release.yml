name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The four archives are built, packaged, smoke-tested and inspected by the
  # same workflow the every-push CI runs (build-archives.yml), so a release is
  # not built any differently from what CI already proved.
  #
  # 'enforce' (REL-008 stage 4): the dependency check
  # (scripts/release_deps_check.sh) passes on all three platforms, so a release
  # whose archive needs more than the operating system provides is refused.
  # Until then this was 'report', because the check failed by design (a dynamic
  # LLVM, MinGW DLLs, msvcrt) and enforcing it would have made every tag,
  # including a dry run of the publishing steps below, unpublishable.
  build:
    uses: ./.github/workflows/build-archives.yml
    with:
      allowlist: enforce

  # Create GitHub Release with all artifacts
  release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      # install.sh is published with the release so the one-liner in the README
      # can point at the version being installed, and it is the file the
      # smoke tests above ran against. gen_recipes.sh is what the recipe step
      # below runs; v2.0.0-rc3's publish job failed with "No such file" because
      # only install.sh was checked out.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            install.sh
            install.ps1
            scripts/gen_recipes.sh
          sparse-checkout-cone-mode: false

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Combine checksums
        run: cat *.sha256 > checksums.txt

      # REL-003 stage 4: Homebrew / Scoop / AUR recipes for the platforms this
      # release actually shipped, attached so whoever bumps those repositories
      # takes them from one place. Publishing to them is not done from here.
      - name: Generate package recipes
        run: ./scripts/gen_recipes.sh --checksums checksums.txt --version "${GITHUB_REF_NAME}" --out recipes

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # A tag with a suffix (v2.0.0-rc1) is a pre-release. GitHub's "latest"
          # skips those, and install.sh's default lookup is releases/latest, so
          # an rc must never be what `curl ... | sh` installs for everyone.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            turf-*.tar.gz
            turf-*.zip
            install.sh
            install.ps1
            checksums.txt
            recipes/homebrew/turf.rb
            recipes/scoop/turf.json
            recipes/aur/PKGBUILD
