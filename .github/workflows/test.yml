name: Turf Test Suites

on:
  push:
    branches: ["master", "dev"]
  pull_request:
    branches: ["master", "dev"]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y llvm-22-dev cmake
          echo "/usr/lib/llvm-22/bin" >> $GITHUB_PATH

      - name: Ensure correct file permissions
        run: |
          chmod +x scripts/update_compiler.sh
          chmod +x scripts/test_runner.sh

      - name: Build llama.cpp
        run: |
          cd external/llama.cpp
          cmake -B build -DBUILD_SHARED_LIBS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_SERVER=OFF
          cmake --build build --config Release -j $(nproc)

      - name: Build Turf Compiler
        run: ./scripts/update_compiler.sh

      - name: Run Test Suites
        run: ./scripts/test_runner.sh
