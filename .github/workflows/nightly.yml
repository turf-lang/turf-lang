name: Nightly (fuzzing and the expensive test axes)
# REL-004 stages 4-5 (docs/planning/ROADMAP_v2.0.0.md Part VII). test.yml runs on
# every push and holds to a time budget; what does not fit there runs here once
# a day: a crash fuzz with a real time budget, and the test-suite axes that cost
# minutes each (GC stress at the optimization levels test.yml skips).
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: "Fuzz time budget in seconds"
        default: "2700"
permissions:
  contents: read
  issues: write
jobs:
  # Invalid input must produce diagnostics, never a crash (Part VII: any ICE,
  # assertion, segfault or hang is a release blocker). The compiler is the
  # sanitized build, so a memory error in a pass is a finding even when the
  # unsanitized binary survives it by luck. Each finding is minimized by the
  # fuzzer; the workflow files one issue per run, carrying the inputs, because
  # the minimized input has to be added to tests/ with its fix (AGENTS.md: every
  # fix gets a regression test).
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Cache LLVM
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: |
            /usr/lib/llvm-22
            /usr/include/llvm-22
            /usr/include/llvm-c-22
          key: llvm-22-${{ runner.os }}-v1
      - name: Install LLVM
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y llvm-22-dev cmake
      - run: echo "/usr/lib/llvm-22/bin" >> $GITHUB_PATH
      - name: Install ccache
        run: sudo apt-get install -y ccache
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-compsan-${{ runner.os }}-nightly-${{ github.sha }}
          restore-keys: |
            ccache-compsan-${{ runner.os }}-
      - name: Build the sanitized Turf compiler
        run: |
          export CC="ccache gcc"
          export CXX="ccache g++"
          cmake -S . -B build_san -DCMAKE_BUILD_TYPE=Release -DTURF_SANITIZE_COMPILER=ON -DTURF_SMART=OFF -DTURF_BUILD_CLI=OFF
          cmake --build build_san -j $(nproc)
      - name: Fuzz (token and line mutations of tests/, showcase/ and examples/)
        id: fuzz
        run: |
          ulimit -s 65536
          python3 scripts/fuzz/crash_fuzz.py \
            --seconds "${{ github.event.inputs.fuzz_seconds || '2700' }}" \
            --opt random --seed "$(date +%s)" \
            --compiler "$(pwd)/build_san/turfc" --out fuzz-findings
      - name: Upload findings
        if: failure() && steps.fuzz.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: fuzz-findings/
      - name: File a release-blocker issue
        if: failure() && steps.fuzz.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The nightly crash fuzz found input the compiler does not survive (run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
            echo
            echo "Each finding is below as its minimized program and the compiler's output. Add the minimized program to \`tests/\` with its fix, pinned with \`// EXPECT-DIAG:\`."
            for t in fuzz-findings/*.tr; do
              echo
              echo "### $(basename "$t")"
              echo '```'
              head -c 2000 "${t%.tr}.txt"
              echo '```'
              echo '```turf'
              head -c 3000 "$t"
              echo
              echo '```'
            done
          } > issue-body.md
          gh issue create --title "Nightly fuzz: compiler crash on invalid input ($(date -u +%F))" \
            --body-file issue-body.md --label release-blocker \
          || gh issue create --title "Nightly fuzz: compiler crash on invalid input ($(date -u +%F))" \
            --body-file issue-body.md

  # GC stress forces a collection on every allocation: the strongest test of
  # root finding, and ~4 minutes a run, so test.yml keeps it to -O0 and -O2.
  # Here are the rest of the axes: the other optimization levels, and -g.
  axes:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Cache LLVM
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: |
            /usr/lib/llvm-22
            /usr/include/llvm-22
            /usr/include/llvm-c-22
          key: llvm-22-${{ runner.os }}-v1
      - name: Install LLVM
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y llvm-22-dev cmake
      - run: echo "/usr/lib/llvm-22/bin" >> $GITHUB_PATH
      - name: Install ccache
        run: sudo apt-get install -y ccache
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-axes-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-axes-${{ runner.os }}-
      - name: Build Turf Compiler
        run: |
          export CC="ccache gcc"
          export CXX="ccache g++"
          ./scripts/cmake_build.sh --release --no-smart
      - name: GC stress -- collect on every allocation (-O1)
        run: TURF_GC_STRESS=1 TURF_TEST_TIMEOUT_SEC=900 ./scripts/test_runner.sh -O1
      - name: GC stress -- collect on every allocation (-O3)
        run: TURF_GC_STRESS=1 TURF_TEST_TIMEOUT_SEC=900 ./scripts/test_runner.sh -O3
      - name: GC stress -- collect on every allocation (-Os)
        run: TURF_GC_STRESS=1 TURF_TEST_TIMEOUT_SEC=900 ./scripts/test_runner.sh -Os
      - name: GC stress -- collect on every allocation (-O0 -g)
        run: TURF_GC_STRESS=1 TURF_TEST_TIMEOUT_SEC=900 ./scripts/test_runner.sh -O0 -g
      - name: Root-finding cross-validation at -O1 and -O3
        run: |
          for O in -O1 -O3; do
            TURF_GC_VALIDATE=1 ./scripts/test_runner.sh $O 2>&1 | tee /tmp/gc_validate.log
            test "${PIPESTATUS[0]}" -eq 0 || exit 1
            if grep -q "TURF_GC_VALIDATE:" /tmp/gc_validate.log; then
              echo "::error::TURF_GC_VALIDATE reported a finding at $O -- see the log above."
              exit 1
            fi
          done
